<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" font-family='"Noto Sans CJK KR","Pretendard",sans-serif' role="img"><defs><marker id="m-P047-555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="0" y="0" width="600" height="250" fill="#fff"/><line x1="36" y1="196" x2="434" y2="196" stroke="#777" stroke-width="1.2" stroke-linecap="round"/><rect x="44" y="46.0" width="62" height="150.0" rx="4" fill="#c8102e"/><text x="75.0" y="37.0" font-size="11" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">5억</text><text x="75.0" y="210.0" font-size="11" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">매출액</text><line x1="106" y1="46.0" x2="122" y2="46.0" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 2"/><rect x="122" y="46.0" width="62" height="90.0" rx="4" fill="#bbb"/><text x="153.0" y="37.0" font-size="11" font-weight="700" fill="#666" text-anchor="middle" dominant-baseline="middle">− 3억</text><text x="153.0" y="210.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">매출원가</text><line x1="184" y1="136.0" x2="200" y2="136.0" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 2"/><rect x="200" y="136.0" width="62" height="60.0" rx="4" fill="#e8344d"/><text x="231.0" y="127.0" font-size="11" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">2억</text><text x="231.0" y="210.0" font-size="11" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">매출총이익</text><line x1="262" y1="136.0" x2="278" y2="136.0" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 2"/><rect x="278" y="136.0" width="62" height="36.0" rx="4" fill="#bbb"/><text x="309.0" y="127.0" font-size="11" font-weight="700" fill="#666" text-anchor="middle" dominant-baseline="middle">− 1억 2천</text><text x="309.0" y="203.5" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">판매비와</text><text x="309.0" y="216.5" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">관리비</text><line x1="340" y1="172.0" x2="356" y2="172.0" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 2"/><rect x="356" y="172.0" width="62" height="24.0" rx="4" fill="#6e0919"/><text x="387.0" y="163.0" font-size="11" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">8천만</text><text x="387.0" y="210.0" font-size="11" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">영업이익</text><text x="231.0" y="14" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">예: 매출 5억 · 매출원가 3억 · 판관비 1억 2천 → 매출총이익 2억 · 영업이익 8천만</text><text x="521.0" y="36" font-size="11" font-weight="700" fill="#666" text-anchor="middle" dominant-baseline="middle">영업이익 이후 단계</text><rect x="448" y="48" width="146" height="28" rx="7" fill="#f3cad1" stroke="#e693a1" stroke-width="1.1"/><text x="521.0" y="62.5" font-size="12" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">영업이익</text><rect x="448" y="110" width="146" height="28" rx="7" fill="#f3cad1" stroke="#e693a1" stroke-width="1.1"/><text x="521.0" y="124.5" font-size="11" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">법인세비용차감전순이익</text><rect x="448" y="172" width="146" height="28" rx="7" fill="#c8102e"/><text x="521.0" y="186.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">당기순이익</text><line x1="464" y1="78" x2="464" y2="108" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#m-P047-555)"/><text x="472" y="86" font-size="11" font-weight="400" fill="#555" text-anchor="start" dominant-baseline="middle">+ 영업외수익</text><text x="472" y="100" font-size="11" font-weight="400" fill="#555" text-anchor="start" dominant-baseline="middle">− 영업외비용(이자비용)</text><line x1="464" y1="140" x2="464" y2="170" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#m-P047-555)"/><text x="472" y="155" font-size="11" font-weight="400" fill="#555" text-anchor="start" dominant-baseline="middle">− 법인세비용</text><text x="300" y="238" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">매총영세당 — 매출 / 매출총이익 / 영업이익 / 세전이익 / 당기순이익 · 이자비용은 영업이익이 아니라 세전이익 단계에서 차감</text></svg>