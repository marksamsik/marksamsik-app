<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 244" width="100%" font-family='"Noto Sans CJK KR","Pretendard",sans-serif' role="img"><defs></defs><rect x="0" y="0" width="600" height="244" fill="#fff"/><text x="349" y="12" font-size="12" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">제품</text><text x="228.0" y="26" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">기존 제품</text><text x="470.0" y="26" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">신제품</text><text x="40" y="121" font-size="12" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 40 121)">시장</text><text x="62" y="76.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">기존 시장</text><text x="62" y="166.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">신시장</text><rect x="110" y="34" width="236" height="84" rx="8" fill="#f3cad1" stroke="#e693a1" stroke-width="1.3"/><text x="228.0" y="60.7" font-size="13" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">시장침투</text><text x="228.0" y="77.97500000000001" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">기존 제품 × 기존 시장</text><text x="228.0" y="92.275" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">이용 빈도↑·점유율↑(할인·판촉·재등록)</text><rect x="352" y="34" width="236" height="84" rx="8" fill="#fae7ea" stroke="#e693a1" stroke-width="1.3"/><text x="470.0" y="60.7" font-size="13" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">제품개발</text><text x="470.0" y="77.97500000000001" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">신제품(신프로그램) × 기존 시장</text><text x="470.0" y="92.275" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">기존 회원에게 새 강좌</text><rect x="110" y="124" width="236" height="84" rx="8" fill="#fae7ea" stroke="#e693a1" stroke-width="1.3"/><text x="228.0" y="150.7" font-size="13" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">시장개발(개척)</text><text x="228.0" y="167.975" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">기존 제품 × 신시장</text><text x="228.0" y="182.275" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">새 지역·새 고객층</text><rect x="352" y="124" width="236" height="84" rx="8" fill="#fae7ea" stroke="#e693a1" stroke-width="1.3"/><text x="470.0" y="150.7" font-size="13" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">다각화</text><text x="470.0" y="167.975" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">신제품 × 신시장 · 위험 최대</text><text x="470.0" y="182.275" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">집중적 · 수평적 · 복합적</text><text x="349" y="230" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">「바꾸지 않고 더 자주」= 시장침투  ·  「개발」 앞 단어가 새것(시장개발 = 새 시장, 제품개발 = 새 제품)</text></svg>