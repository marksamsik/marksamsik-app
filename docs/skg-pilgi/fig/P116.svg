<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" font-family='"Noto Sans CJK KR","Pretendard",sans-serif' role="img"><defs></defs><rect x="0" y="0" width="600" height="250" fill="#fff"/><text x="349" y="12" font-size="12" font-weight="700" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">사고 유형</text><text x="228.0" y="26" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">이성적</text><text x="470.0" y="26" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">감성적</text><text x="40" y="121" font-size="12" font-weight="700" fill="#203d6c" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 40 121)">관여도</text><text x="62" y="76.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">고관여</text><text x="62" y="166.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">저관여</text><rect x="110" y="34" width="236" height="84" rx="8" fill="#d4dff2" stroke="#3a6fc4" stroke-width="1.6"/><text x="228.0" y="53.55" font-size="13" font-weight="700" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">정보형</text><text x="228.0" y="70.825" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">고가 골프회원권 · 고가 다기능 피트니스 기구</text><text x="228.0" y="85.125" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">자동차·보험</text><text x="228.0" y="99.42500000000001" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">→ 정보·비교 광고</text><rect x="352" y="34" width="236" height="84" rx="8" fill="#ebf1f9" stroke="#a6bee4" stroke-width="1.3"/><text x="470.0" y="60.7" font-size="13" font-weight="700" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">감성형</text><text x="470.0" y="77.97500000000001" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">명품 · 패션 스포츠웨어 · 스포츠카</text><text x="470.0" y="92.275" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">→ 이미지 광고</text><rect x="110" y="124" width="236" height="84" rx="8" fill="#ebf1f9" stroke="#a6bee4" stroke-width="1.3"/><text x="228.0" y="157.85" font-size="13" font-weight="700" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">습관형</text><text x="228.0" y="175.125" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">생활용품 · 스포츠음료</text><rect x="352" y="124" width="236" height="84" rx="8" fill="#ebf1f9" stroke="#a6bee4" stroke-width="1.3"/><text x="470.0" y="157.85" font-size="13" font-weight="700" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">자기만족형</text><text x="470.0" y="175.125" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">과자 · 주류</text><text x="300" y="226" font-size="11" font-weight="700" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">「고가 = 감성」이 아니다 — 회원권·기구는 조건을 비교하는 고관여·이성(정보형) 칸</text><text x="300" y="242" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">참여 형태 인정행 — 인지적 / 정의적 / 행동적(창조적 ✕) · 유치 요인 = 인구통계·상황·동기(정치 ✕)</text></svg>