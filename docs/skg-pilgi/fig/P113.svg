<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 256" width="100%" font-family='"Noto Sans CJK KR","Pretendard",sans-serif' role="img"><defs></defs><rect x="0" y="0" width="600" height="256" fill="#fff"/><text x="8" y="16" font-size="12" font-weight="700" fill="#203d6c" text-anchor="start" dominant-baseline="middle">허프 중력모델</text><text x="8" y="32" font-size="11" font-weight="400" fill="#555" text-anchor="start" dominant-baseline="middle">규모에 비례 · 거리에 반비례(제곱)</text><circle cx="90" cy="124" r="24" fill="#2d2a2c"/><text x="90" y="119" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">이용자</text><text x="90" y="132" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">(출발점)</text><line x1="110" y1="112" x2="236" y2="70" stroke="#203d6c" stroke-width="1.8" stroke-linecap="round"/><circle cx="262" cy="58" r="28" fill="#d4dff2" stroke="#3a6fc4" stroke-width="2"/><text x="262" y="53" font-size="14" font-weight="700" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">X</text><text x="262" y="68" font-size="11" font-weight="400" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">3,000㎡</text><text x="160" y="70" font-size="11" font-weight="700" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">거리 2km</text><line x1="116" y1="124" x2="472" y2="124" stroke="#777" stroke-width="1.8" stroke-linecap="round"/><circle cx="520" cy="124" r="46" fill="#ebf1f9" stroke="#a6bee4" stroke-width="2"/><text x="520" y="119" font-size="14" font-weight="700" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">Y</text><text x="520" y="134" font-size="11" font-weight="400" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">8,000㎡</text><text x="300" y="112" font-size="11" font-weight="700" fill="#555" text-anchor="middle" dominant-baseline="middle">거리 4km</text><rect x="170" y="150" width="240" height="60" rx="8" fill="#fff" stroke="#3a6fc4" stroke-width="1.3"/><text x="290" y="165" font-size="12" font-weight="700" fill="#3a6fc4" text-anchor="middle" dominant-baseline="middle">매력도 ∝ 규모 ÷ 거리²</text><text x="290" y="183" font-size="11" font-weight="700" fill="#203d6c" text-anchor="middle" dominant-baseline="middle">X = 3,000 ÷ 2² = 750</text><text x="290" y="199" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">Y = 8,000 ÷ 4² = 500 → X 우세</text><text x="300" y="230" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">함정: 거리를 「비례」로 쓰거나 제곱하지 않으면 Y가 커 보인다 · 시간거리(이동 소요시간)로 환산 가능</text><text x="300" y="246" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">가중치법은 Σ(가중치 × 점수) — 단순 합계(D 31점) 금지</text></svg>