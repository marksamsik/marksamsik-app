<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" font-family='"Noto Sans CJK KR","Pretendard",sans-serif' role="img"><defs><marker id="m-P070-77400e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#77400e"/></marker></defs><rect x="0" y="0" width="600" height="240" fill="#fff"/><rect x="60" y="156" width="530" height="40" rx="8" fill="#f9eadd"/><text x="74" y="177.0" font-size="13" font-weight="700" fill="#77400e" text-anchor="start" dominant-baseline="middle">1 명목척도</text><text x="160" y="169" font-size="11" font-weight="400" fill="#77400e" text-anchor="start" dominant-baseline="middle">분류·구분만, 순서 없음</text><text x="160" y="184" font-size="11" font-weight="400" fill="#77400e" text-anchor="start" dominant-baseline="middle">예: 성별·종목·등번호·회원번호</text><rect x="100" y="110" width="490" height="40" rx="8" fill="#f2ceaf"/><text x="114" y="131.0" font-size="13" font-weight="700" fill="#77400e" text-anchor="start" dominant-baseline="middle">2 서열척도</text><text x="200" y="123" font-size="11" font-weight="400" fill="#77400e" text-anchor="start" dominant-baseline="middle">순위·순서만, 간격 불일정</text><text x="200" y="138" font-size="11" font-weight="400" fill="#77400e" text-anchor="start" dominant-baseline="middle">예: 선호순위·리그 순위·만족도 순위</text><rect x="140" y="64" width="450" height="40" rx="8" fill="#e8ac76"/><text x="154" y="85.0" font-size="13" font-weight="700" fill="#fff" text-anchor="start" dominant-baseline="middle">3 등간척도</text><text x="240" y="77" font-size="11" font-weight="700" fill="#fff" text-anchor="start" dominant-baseline="middle">간격 동일, 절대영점 없음</text><text x="240" y="92" font-size="11" font-weight="400" fill="#fff" text-anchor="start" dominant-baseline="middle">예: 온도·연도·리커트 만족도 점수</text><rect x="180" y="18" width="410" height="40" rx="8" fill="#d9741a"/><text x="194" y="39.0" font-size="13" font-weight="700" fill="#fff" text-anchor="start" dominant-baseline="middle">4 비율척도</text><text x="280" y="31" font-size="11" font-weight="700" fill="#fff" text-anchor="start" dominant-baseline="middle">절대영점 있음, 배수 비교 가능</text><text x="280" y="46" font-size="11" font-weight="400" fill="#fff" text-anchor="start" dominant-baseline="middle">예: 매출·관중 수·나이·이용횟수</text><line x1="30" y1="196" x2="30" y2="22" stroke="#77400e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#m-P070-77400e)"/><text x="16" y="109" font-size="11" font-weight="700" fill="#77400e" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 16 109)">정보량 ↑ · 상위 척도는 하위 분석 모두 가능</text><text x="300" y="214" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">명서등비 · 「0이 진짜 없음인가?」「2배라 말할 수 있나?」 → 예 = 비율, 아니오 = 등간</text><text x="300" y="230" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">「비교측정」은 4수준이 아님 · 리커트 점수는 통상 등간으로 취급</text></svg>