<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec">
<meta name="robots" content="noindex,nofollow">
<title>마크삼식 실무 생성기</title>
<style>
  html,body{margin:0;height:100%;background:#f5f2ec;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f5f2ec}
  #off{display:none;position:fixed;inset:0;color:#26231f;font:16px/1.7 sans-serif;text-align:center;padding:30vh 24px 0}
  #off button{margin-top:16px;padding:12px 22px;border:0;border-radius:10px;background:#e0a53a;color:#241a06;font-size:16px;font-weight:700}
</style>
</head>
<body>
<!-- 🌈 앱(com.marksamsik.silmu) 전용 액자. 웹에서 쓰는 액자는 index.html(그대로 둠).
     앱이 ?dev=기기번호 로 이 페이지를 열면 → 실무 생성기 웹앱을 /exec?app=1&dev=… 로 띄우고,
     웹앱 화면과 앱(window.KKApp · Play 결제) 사이의 말을 postMessage 로 이어 줍니다. -->
<iframe id="app" title="마크삼식 실무 생성기" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="off">📶 인터넷 연결을 확인해 주세요<br><button onclick="location.reload()">다시 시도</button></div>
<script>
  // ▼ 실무 생성기 웹앱 주소 (Apps Script 「배포 관리 → ✏️ → 새 버전」으로만 배포하면 안 바뀜) — index.html 과 같은 값
  var APP = "https://script.google.com/macros/s/AKfycbxMsKQ0DzCYmow5MTO12ZW0_KKbK02miylBn2ZzkkjAM6d2RvQg7wPsi1P8I7c7DJzgwg/exec";
  var q = new URLSearchParams(location.search);
  var dev = (q.get('dev') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
  if (!dev && window.KKApp && KKApp.deviceId) { try { dev = KKApp.deviceId(); } catch (e) {} }
  var frame = document.getElementById('app');
  if (navigator.onLine === false) {
    document.getElementById('off').style.display = 'block';
    frame.style.display = 'none';
  } else {
    frame.src = APP + '?app=1&dev=' + encodeURIComponent(dev);
  }

  // ---- 웹앱 화면 ↔ 앱(결제) 다리 ----
  var waiters = [];   // 상태를 받을 화면(웹앱 안쪽 창)
  function packNow() {
    try { return window.KKApp && KKApp.packState ? JSON.parse(KKApp.packState()) : { owned: false, ready: false, msg: '앱 밖에서는 결제할 수 없어요.' }; }
    catch (e) { return { owned: false, ready: false, msg: '결제 상태를 읽지 못했어요.' }; }
  }
  function send(src, pack) { try { src.postMessage({ kk: 'silmu', t: 'state', pack: pack }, '*'); } catch (e) {} }
  // 앱(Java)이 결제 상태가 바뀔 때 부름
  window.kkPack = function (st) { waiters.forEach(function (w) { send(w, st); }); };
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.kk !== 'silmu' || !e.source) return;
    if (!/(^|\.)googleusercontent\.com$|^script\.google\.com$/.test(new URL(e.origin).hostname)) return;
    if (waiters.indexOf(e.source) < 0) waiters.push(e.source);
    if (d.t === 'hello') send(e.source, packNow());
    else if (d.t === 'buy' && window.KKApp) KKApp.buyItem(String(d.id || 'silmu_full'));
    else if (d.t === 'refresh' && window.KKApp) KKApp.refreshPack();
    else if (d.t === 'copy' && window.KKApp && KKApp.copy) KKApp.copy(String(d.text || '').slice(0, 200));
  });
</script>
</body>
</html>
