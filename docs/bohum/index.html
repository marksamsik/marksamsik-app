<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>보험뽀개기</title>
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#fbf9f4}
  #f{display:block;border:0;width:100%;height:100%}
  #msg{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#6b6456;
       text-align:center;padding:40px 20px;font-size:14px;line-height:1.7}
  #msg a{color:#2a5d8f}
</style>
</head>
<body>
<iframe id="f" title="보험뽀개기" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
<div id="msg" hidden>화면이 비어 있으면 <a id="direct" href="#" target="_blank" rel="noopener">새 창에서 열기</a></div>
<script>
  var PORTAL = "https://script.google.com/macros/s/AKfycbxkLYav1Pv7Dvfx0yuZYk2BEeF985Xl9-gtSlab-sD5zx4wN73ZoqHjIQpQV36w6sY/exec";
  var q = window.location.search || "";
  document.getElementById("f").src = PORTAL + q;
  document.getElementById("direct").href = PORTAL;
  setTimeout(function(){ document.getElementById("msg").hidden = false; }, 8000);
</script>
</body>
</html>
