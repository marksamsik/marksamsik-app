<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 206" width="100%" font-family='"Noto Sans CJK KR","Pretendard",sans-serif' role="img"><defs><marker id="m-T69-555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="0" y="0" width="600" height="206" fill="#fff"/><rect x="16" y="16" width="118" height="46" rx="8" fill="#f3cad1" stroke="#c8102e" stroke-width="1.5"/><text x="75.0" y="39.0" font-size="14" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">매출액</text><rect x="241" y="16" width="118" height="46" rx="8" fill="#f3cad1" stroke="#c8102e" stroke-width="1.5"/><text x="300.0" y="39.0" font-size="14" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">영업이익</text><rect x="466" y="16" width="118" height="46" rx="8" fill="#f3cad1" stroke="#c8102e" stroke-width="1.5"/><text x="525.0" y="39.0" font-size="14" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">순이익</text><line x1="136" y1="39.0" x2="239" y2="39.0" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m-T69-555)"/><text x="187.5" y="14" font-size="11" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">고정영업비</text><text x="187.5" y="55.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">변동 확대</text><line x1="361" y1="39.0" x2="464" y2="39.0" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m-T69-555)"/><text x="412.5" y="14" font-size="11" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">이자비용(고정재무비)</text><text x="412.5" y="55.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">변동 확대</text><path d="M75.0,76 L75.0,84 L300.0,84 L300.0,76" stroke="#6e0919" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="79.0" y="90" width="217.0" height="36" rx="7" fill="#fae7ea" stroke="#e693a1" stroke-width="1.1"/><text x="187.5" y="102" font-size="12" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">영업레버리지(매출액 → 영업이익)</text><text x="187.5" y="118" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">DOL = 공헌이익 ÷ 영업이익</text><path d="M306.0,76 L306.0,84 L525.0,84 L525.0,76" stroke="#6e0919" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="310.0" y="90" width="211.0" height="36" rx="7" fill="#fae7ea" stroke="#e693a1" stroke-width="1.1"/><text x="415.5" y="102" font-size="12" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">재무레버리지(영업이익 → 순이익)</text><text x="415.5" y="118" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">DFL = 영업이익 ÷ (영업이익 − 이자비용)</text><path d="M75.0,136 L75.0,144 L525.0,144 L525.0,136" stroke="#6e0919" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="79.0" y="150" width="442.0" height="36" rx="7" fill="#fff" stroke="#e693a1" stroke-width="1.1"/><text x="300.0" y="162" font-size="12" font-weight="700" fill="#6e0919" text-anchor="middle" dominant-baseline="middle">결합레버리지(매출액 → 순이익) = 둘 다</text><text x="300.0" y="178" font-size="11" font-weight="400" fill="#222" text-anchor="middle" dominant-baseline="middle">DCL = DOL × DFL</text><text x="300" y="198" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">매출액 10% 변동 → 영업이익 변동 = 10% × DOL  ·  DOL = 1 ÷ 안전한계율</text></svg>