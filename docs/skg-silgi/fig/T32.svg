<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 244" width="100%" font-family='"Noto Sans CJK KR","Pretendard",sans-serif' role="img"><defs></defs><rect x="0" y="0" width="600" height="244" fill="#fff"/><circle cx="128" cy="122" r="112" fill="#fbf1e8" stroke="#eec098" stroke-width="1.3"/><circle cx="128" cy="122" r="76" fill="#f7e0cd" stroke="#eec098" stroke-width="1.3"/><circle cx="128" cy="122" r="40" fill="#d9741a"/><text x="128" y="116" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">핵심제품</text><text x="128" y="131" font-size="11" font-weight="400" fill="#fff" text-anchor="middle" dominant-baseline="middle">근본 편익</text><text x="128" y="66" font-size="12" font-weight="700" fill="#77400e" text-anchor="middle" dominant-baseline="middle">실제제품</text><text x="128" y="29" font-size="12" font-weight="700" fill="#77400e" text-anchor="middle" dominant-baseline="middle">확장제품</text><rect x="262" y="14" width="330" height="58" rx="8" fill="#d9741a" stroke="#eec098" stroke-width="1.1"/><rect x="270" y="22" width="68" height="20" rx="10" fill="#77400e"/><text x="304" y="32.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">핵심제품</text><text x="346" y="32" font-size="11" font-weight="400" fill="#fff" text-anchor="start" dominant-baseline="middle">소비자가 실제로 추구하는 근본 편익</text><text x="278" y="58" font-size="11" font-weight="700" fill="#fff" text-anchor="start" dominant-baseline="middle">프로야구:</text><text x="334" y="58" font-size="11" font-weight="400" fill="#fff" text-anchor="start" dominant-baseline="middle">즐거움 · 감동 · 소속감</text><rect x="262" y="80" width="330" height="58" rx="8" fill="#f7e0cd" stroke="#eec098" stroke-width="1.1"/><rect x="270" y="88" width="68" height="20" rx="10" fill="#fff"/><text x="304" y="98.5" font-size="11" font-weight="700" fill="#77400e" text-anchor="middle" dominant-baseline="middle">실제제품</text><text x="346" y="98" font-size="11" font-weight="400" fill="#77400e" text-anchor="start" dominant-baseline="middle">편익을 담은 형태(품질·디자인·브랜드·포장)</text><text x="278" y="124" font-size="11" font-weight="700" fill="#77400e" text-anchor="start" dominant-baseline="middle">프로야구:</text><text x="334" y="124" font-size="11" font-weight="400" fill="#77400e" text-anchor="start" dominant-baseline="middle">경기 관람 자체 · 경기 품질 · 구단 브랜드</text><rect x="262" y="146" width="330" height="58" rx="8" fill="#fbf1e8" stroke="#eec098" stroke-width="1.1"/><rect x="270" y="154" width="68" height="20" rx="10" fill="#fff"/><text x="304" y="164.5" font-size="11" font-weight="700" fill="#77400e" text-anchor="middle" dominant-baseline="middle">확장제품</text><text x="346" y="164" font-size="11" font-weight="400" fill="#77400e" text-anchor="start" dominant-baseline="middle">실제제품에 덧붙는 부가 서비스 · 경험</text><text x="278" y="190" font-size="11" font-weight="700" fill="#77400e" text-anchor="start" dominant-baseline="middle">프로야구:</text><text x="334" y="190" font-size="11" font-weight="400" fill="#77400e" text-anchor="start" dominant-baseline="middle">팬서비스 · 멤버십 · 먹거리·편의시설 · 응원 이벤트</text><text x="427" y="230" font-size="11" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">실제제품의 차이가 줄수록 → 확장제품(서비스·경험)이 차별화의 무대</text></svg>