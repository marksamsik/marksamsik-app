# 🩷 마크삼식 헬스 기록 아이폰 앱 — XcodeGen 설정 (GitHub Actions 맥 서버에서 xcodegen generate 로 Health.xcodeproj 생성)
# 화면(www)은 안드로이드 핑크 앱(gusul-app/pink/app/src/main/assets/www)과 같은 파일을 복사해 씀
name: Health
options:
  bundleIdPrefix: com.marksamsik
  deploymentTarget:
    iOS: "16.0"   # 사진 글자 인식(Vision)의 한국어가 iOS 16부터
settings:
  base:
    DEVELOPMENT_TEAM: X76WSY6867
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Health:
    type: application
    platform: iOS
    sources:
      - path: Health
        excludes: ["www/**"]
      - path: Health/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marksamsik.health
        PRODUCT_NAME: Health
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Health/Info.plist
        ENABLE_BITCODE: NO
    info:
      path: Health/Info.plist
      properties:
        CFBundleDisplayName: 마크삼식 헬스 기록
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBG
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        NSMicrophoneUsageDescription: 「벤치 60 10개 3세트」처럼 말로 운동을 기록할 때 마이크를 써요. 마이크 단추를 누를 때만 켜져요.
        NSSpeechRecognitionUsageDescription: 말한 운동 기록을 글자로 바꿀 때 아이폰 음성 인식을 써요.
        NSCameraUsageDescription: 인바디 결과지나 오운완 배경을 사진으로 찍을 때 카메라를 써요.
        NSPhotoLibraryAddUsageDescription: 오운완 이미지를 사진 앱에 저장할 때 써요.
