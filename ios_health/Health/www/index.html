*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
body{display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--main);border-color:transparent}
.hide{display:none!important}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;flex:none;background:var(--coal) var(--face) center/cover;box-shadow:0 0 0 2px var(--main),0 0 0 5px rgba(255,95,162,.16)}
.ttl{flex:1;min-width:0}.ttl b{display:block;font-size:17px;color:var(--ivory);line-height:1.2}
.ttl small{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:17px;flex:none}
.ib.mic{color:#fff;background:var(--main);border-color:var(--main)}
main{flex:1;min-height:0;position:relative}
.pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px 90px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.pg>*{flex-shrink:0;min-width:0}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg2);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:10px;color:var(--dim);font-size:11.5px;font-weight:700}
.nav button i{font-style:normal;font-size:21px;line-height:1.1;filter:grayscale(.7);opacity:.8}
.nav button.on{color:var(--main2);background:var(--maind)}.nav button.on i{filter:none;opacity:1}
.card{padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0}
.h3{font-size:15.5px;font-weight:900;color:var(--ivory);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.h3 small{font-weight:600;color:var(--dim);font-size:12px}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;margin:4px 0 0}
.hero{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:14px;background:linear-gradient(135deg,#2a1622,var(--panel));border:1px solid var(--mainb)}
.hero .fc{width:46px;height:46px;border-radius:50%;flex:none;background:var(--coal) var(--face) center/cover;box-shadow:0 0 0 2px var(--main)}
.hero>div{flex:1;min-width:0}.hero small{color:var(--main2);font-size:12px;font-weight:700}
.hero b{display:block;color:var(--ivory);font-size:15px;margin-top:2px;line-height:1.55;font-weight:700}
.big{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#ff5fa2,#c23a78);color:#fff;text-align:left;box-shadow:0 6px 18px rgba(255,95,162,.25)}
.big i{font-style:normal;font-size:28px;flex:none}.big>div{flex:1;min-width:0}.big b{display:block;font-size:17px}.big small{display:block;font-size:12.5px;opacity:.92;line-height:1.4}
.big em{font-style:normal;font-weight:900;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font-weight:800;font-size:14.5px}
.btn.p{background:var(--main);border-color:var(--main);color:#1d0612}
.btn.g{background:#1d3a2a;border-color:#2e6b48;color:#bff0d2}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.w{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--maind);border-color:var(--main);color:var(--main2)}
.lst{display:flex;flex-direction:column;gap:6px}
.it{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.it .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);font-size:17px;flex:none}
.it>div{flex:1;min-width:0}.it b{display:block;font-size:15px;color:var(--ivory)}.it small{display:block;font-size:12.3px;color:var(--dim);line-height:1.4}
.it .go{color:var(--dim);font-size:18px;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--panel2);color:var(--muted);margin-right:3px}
/* 몸 그림 */
.bodyw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.body{position:relative;border-radius:12px;overflow:hidden;background:#eee;aspect-ratio:362/830}
.body img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.body .z{position:absolute;border-radius:40%;border:0;background:rgba(255,95,162,0);transition:background .15s}
.body .z.on{background:rgba(255,95,162,.42);box-shadow:0 0 0 2px rgba(255,95,162,.8) inset}
.body .lb{position:absolute;left:6px;top:6px;font-size:11.5px;font-weight:900;color:#3a1426;background:rgba(255,255,255,.85);border-radius:6px;padding:1px 6px}
/* 운동 중 카드 */
.ex{padding:11px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.ex.cur{border-color:var(--main);box-shadow:0 0 0 2px rgba(255,95,162,.18)}
.ex .hd{display:flex;align-items:center;gap:8px}
.ex .hd b{flex:1;min-width:0;font-size:16px;color:var(--ivory)}
.sets{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.st{padding:4px 8px;border-radius:8px;background:var(--panel2);font-size:13px;font-weight:700;color:var(--ivory)}
.st.ok{background:#1d3a2a;color:#bff0d2}
.prev{font-size:12.3px;color:var(--dim);margin-top:5px}
/* 기록 시트 */
.sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:rgba(0,0,0,.55)}
.sheet .sb{margin-top:auto;max-height:94%;overflow-y:auto;background:var(--bg2);border-radius:18px 18px 0 0;border-top:1px solid var(--line2);padding:12px 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sheet .sh{display:flex;align-items:center;gap:8px}.sheet .sh b{flex:1;font-size:18px;color:var(--ivory)}
.wbig{font-size:38px;font-weight:900;color:#fff;text-align:center;line-height:1.1}
.wbig small{font-size:15px;color:var(--muted);font-weight:700;margin-left:3px}
.wsub{text-align:center;font-size:12.5px;color:var(--muted)}
