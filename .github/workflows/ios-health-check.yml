name: 🩷 핑크 아이폰 코드 점검 (서명·업로드 안 함)

# 직접 「Run workflow」를 눌렀을 때만 시뮬레이터용으로 컴파일해 봅니다(자동 실행 없음). Secrets 를 쓰지 않습니다.
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: 프로젝트 만들기 · 컴파일
        working-directory: ios_health
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
          xcodebuild -project Health.xcodeproj -scheme Health -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 || {
              grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -n 30 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
              tail -n 40 "$RUNNER_TEMP/build.log"; exit 1; }
          grep -E "warning:" "$RUNNER_TEMP/build.log" | grep -v "^ld:" | sort -u | head -n 30 | while IFS= read -r l; do echo "::warning::${l:0:900}"; done
          tail -n 5 "$RUNNER_TEMP/build.log"
